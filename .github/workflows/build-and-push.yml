# Builds the Ignis fork Docker image and publishes it to GHCR with the
# :latest tag.
#
# Every run first syncs the fork with the upstream repo (Nystik-gh/ignis),
# keeping the fork's own commits (the custom patch) applied on top, then
# builds and pushes the image. Runs on every push to main, on a nightly
# schedule (to pick up upstream changes), and manually via workflow_dispatch.
#
# The push back to main uses the default GITHUB_TOKEN, which does NOT
# re-trigger this workflow, so there is no build loop.

name: Build and push fork image

on:
  push:
    branches: [main]
  schedule:
    # Nightly at 03:17 UTC — rebuilds whenever upstream changed.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history for merging upstream)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream, keep fork patch on top
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add upstream only if not already present (rerun safety).
          git remote add upstream https://github.com/Nystik-gh/ignis.git 2>/dev/null || true

          git fetch upstream main

          # Merge upstream into the fork. The fork's own commits (the
          # client-state patch) stay applied; upstream changes come in below.
          if ! git merge --no-edit upstream/main; then
            echo "::error::Merge with upstream failed. Resolve the conflict locally, then push."
            echo "::error::  git fetch upstream main"
            echo "::error::  git merge upstream/main"
            echo "::error::  git push origin main"
            exit 1
          fi

          # Push the synced branch back to the fork.
          # GITHUB_TOKEN pushes do not trigger new workflow runs.
          git push origin main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ignis-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            IGNIS_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
